---
workflow:
  rules:
    # Temporary mirror diagnostic: create a pipeline for every ref update.
    - when: always

stages:
  - prepare
  - check
  - publish

variables:
  GIT_DEPTH: "0"
  GITHUB_REPOSITORY: "NVIDIA/nautobot-app-nvdatamodels"
  KITMAKER_PROJECT_NAME: "nautobot-nvdatamodels"

.kitmaker-job:
  tags:
    - dca
    - linux/amd64
    - docker
  image: "mirror.gcr.io/alpine:3.23"
  before_script:
    - apk add --no-cache bash curl git jq python3
  rules:
    - if: "$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(rc[1-9][0-9]*)?$/"

mirror-sync-smoke:
  stage: prepare
  tags:
    - dca
    - linux/amd64
    - docker
  image: "mirror.gcr.io/alpine:3.23"
  rules:
    - when: always
  script:
    - echo "GitLab CI triggered for ${CI_COMMIT_REF_NAME} from ${CI_PIPELINE_SOURCE}."

release-policy:
  extends: ".kitmaker-job"
  stage: prepare
  rules:
    - if: "$CI_COMMIT_TAG =~ /^v/"
  script:
    - bash .gitlab/scripts/validate-release-tag.sh "${CI_DEFAULT_BRANCH}"

github-release-assets:
  extends: ".kitmaker-job"
  stage: prepare
  script:
    - bash .gitlab/scripts/wait-for-github-release-assets.sh dist/github-wheel-assets.tsv
  artifacts:
    paths:
      - dist/github-wheel-assets.tsv
    expire_in: "1 day"

kitmaker-check:
  extends: ".kitmaker-job"
  stage: check
  needs:
    - job: release-policy
    - job: github-release-assets
      artifacts: true
  script:
    - bash .gitlab/scripts/kitmaker-release.sh false dist/github-wheel-assets.tsv

kitmaker-publish:
  extends: ".kitmaker-job"
  stage: publish
  needs:
    - job: kitmaker-check
    - job: github-release-assets
      artifacts: true
  rules:
    - if: "$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$/"
  script:
    - bash .gitlab/scripts/kitmaker-release.sh true dist/github-wheel-assets.tsv
