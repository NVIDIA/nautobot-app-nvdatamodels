---
name: "Build and publish app packages to PyPI"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: "read"

env:
  PYTHON_VERSION: "3.12"

jobs:
  release-policy:
    name: "Validate release tag"
    runs-on: "ubuntu-latest"
    outputs:
      pypi_publish: ${{ steps.validate.outputs.pypi_publish }}
    steps:
      - name: "Check out repository history"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0
      - name: "Set up Python for package metadata validation"
        uses: "actions/setup-python@v5"
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "Validate the release tag"
        id: "validate"
        run: bash .github/scripts/validate-release-tag.sh main

  build-packages:
    name: "Build release packages"
    runs-on: "ubuntu-latest"
    needs:
      - "release-policy"
    env:
      INVOKE_NAUTOBOT_NVDATAMODELS_LOCAL: "True"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v4"
      - name: "Setup environment"
        uses: "./.github/actions/setup-environment"
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "Build distribution packages"
        run: uv run invoke generate-packages
      - name: "Verify built packages"
        run: |
          ls -lh dist/
          python -m pip install twine
          twine check dist/*
      - name: "Save the distribution package artifacts"
        uses: "actions/upload-artifact@v4"
        with:
          name: "python-package-distributions"
          path: "dist/"

  github-release:
    name: "Publish packages as GitHub Release assets"
    runs-on: "ubuntu-latest"
    needs:
      - "build-packages"
      - "release-policy"
    permissions:
      contents: "write"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v4"
      - name: "Pull the saved distribution package artifacts"
        uses: "actions/download-artifact@v4"
        with:
          name: "python-package-distributions"
          path: "dist/"
      - name: "Publish GitHub Release assets"
        run: bash .github/scripts/publish-github-release-assets.sh dist
        env:
          GH_TOKEN: ${{ github.token }}

  pypi-publish:
    name: "Publish packages to PyPI"
    runs-on: "ubuntu-latest"
    needs:
      - "build-packages"
      - "github-release"
      - "release-policy"
    if: ${{ needs.release-policy.outputs.pypi_publish == 'true' }}
    environment:
      name: "pypi"
      url: "https://pypi.org/project/nautobot-nvdatamodels/"
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: "Pull the saved distribution package artifacts"
        uses: "actions/download-artifact@v4"
        with:
          name: "python-package-distributions"
          path: "dist/"
      - name: "Publish packages to PyPI"
        uses: "pypa/gh-action-pypi-publish@release/v1"
        with:
          packages-dir: "dist/"
