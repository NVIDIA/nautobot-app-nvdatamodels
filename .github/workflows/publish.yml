---
name: "Build and publish GitHub Release packages"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-packages:
    name: "Build new release packages"
    runs-on: "ubuntu-latest"
    env:
      INVOKE_NAUTOBOT_NVDATAMODELS_LOCAL: "True"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v4"
      - name: "Setup environment"
        uses: "./.github/actions/setup-environment"
      - name: "Add release version to env"
        run: echo RELEASE_VERSION=${GITHUB_REF:10} >> $GITHUB_ENV
      - name: "Build distribution packages"
        run: uv run invoke generate-packages
      - name: "Verify built packages"
        run: |
          ls -lh dist/
          python -m pip install twine
          twine check dist/*
      - name: "Save the distribution package artifacts"
        uses: "actions/upload-artifact@v4"
        with:
          name: "python-package-distributions"
          path: "dist/"

  release-policy:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    name: "Validate release tag"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository history"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0
      - name: "Set up Python for package metadata validation"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"
      - name: "Validate the release tag"
        run: bash .github/scripts/validate-release-tag.sh main

  github-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - "build-packages"
      - "release-policy"
    name: "Publish packages as GitHub Release assets"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v4"
      - name: "Pull the saved distribution package artifacts"
        uses: "actions/download-artifact@v4"
        with:
          name: "python-package-distributions"
          path: "dist/"
      - name: "Publish GitHub Release assets"
        run: bash .github/scripts/publish-github-release-assets.sh dist
        env:
          GH_TOKEN: ${{ github.token }}
